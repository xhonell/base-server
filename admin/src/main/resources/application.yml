# application.yml
server:
  port: 8803

spring:
  application:
    name: ADMIN-SERVICE-01
  profiles:
    # 环境标识
    active: DEV

  config:
    import:
      - optional:nacos:COMMON-SERVICE-${spring.profiles.active}?group=COMMON_GROUP
      - optional:nacos:CONFIG-SERVICE-${spring.profiles.active}?group=COMMON_GROUP

  cloud:
    nacos:
      # 注册中心
      discovery:
        enabled: true
        server-addr: 47.108.221.145:8848
        username: "nacos"
        password: "12345678"

      #配置中心
      config:
        import-check:
          enabled: false
        server-addr: 47.108.221.145:8848
        group: COMMON_GROUP
        file-extension: yaml
        refresh-enabled: true
        namespace: ""
        username: "nacos"
        password: "12345678"
